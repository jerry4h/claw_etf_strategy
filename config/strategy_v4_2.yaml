strategy:
  name: 虾池ETF轮动 v4.2 — 对抗鲁棒生产版
  version: '4.2'
  note: v4.0 框架(评估/降维/优化/OOS)产出的生产 config; 7-seed 严格 PASS, 3 通道 OOS TRUE_ROBUST
scoring:
  mom_w: 1.0
  vol_w: 1.1
selection:
  top_n: 2
  score_margin: 0.02
  dynamic_margin_sensitivity: 1.0
  dynamic_margin_window: 3
  trend_confirm_weeks: 0
factors:
  mom_window: 6
  vol_window: 10
  pe_window_years: 5
  ewma_factors_enabled: false
  ewma_mom_halflife: 16
  ewma_vol_halflife: 6
defense:
  def_alloc: 0.1447
  step_low: 0.0954
  step_high: 0.1933
  # max_def 是 vol-tier 三段式插值的"基线天花板", 非引擎最终硬上界。
  # 实际上界会因 Layer 3.5 危机相关性(+crisis_corr_max_boost=0.15) 与 A 股 vol boost 突破,
  # 极端相关时可达 ~0.96 (见 test_consistency.py P1-5 断言)。
  max_def: 0.8114
  hongli_ratio: 0.5
crisis_correlation:
  window: 26
  corr_threshold: 0.6
  boost_slope: 1.875
  max_boost: 0.15
hongli_formula:
  intercept: 0.8
  vol_coeff: 2.67
rebalance:
  threshold: 0.025
  fee_rate: 5.0e-05
  anchor: W-MON
risk_control:
  stop_loss: 0.08
  recovery_weeks: 4
allocation:
  max_single_alloc: 0.4
  overflow_to_defense_only: true
  dynamic_weight_cap: false
inv_vol_allocation:
  enabled: true
  window: 10
d4_individual_filter:
  enabled: false
softmax_allocation:
  enabled: false
dynamic_weighting:
  enabled: false
constituent_signals:
  enabled: false
regime_classifier:
  enabled: false
data:
  nav_path: data/all_etfs_nav_latest.csv
  pe_path: data/300etf_pe_percentile_weekly.csv
  start_date: 2013-05-17
  end_date: null
reporting:
  risk_free_rate: 0.025
