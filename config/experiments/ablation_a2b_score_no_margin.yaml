strategy:
  name: 消融A2b — 动量-波动评分但无粘性（补充拆解变体）
  version: '4.3-ablation-A2b'
  note: "基于 v4.3 复制。补充变体: 同 A1 但 vol_w=1.1(字面解读'同 A1 但保留 vol_w 评分')。与 A2 联合使用可把 Layer1 贡献拆成'波动率惩罚项'(A2b-A1)与'score_margin 粘性'(A2-A2b)两部分。其余全关: 无防御层、无 crisis boost、无止损、无 inv_vol、无 40% 上限、无粘性(score_margin=0, dynamic_margin_sensitivity=0)。"
scoring:
  mom_w: 1.0
  vol_w: 1.1
selection:
  top_n: 2
  score_margin: 0.0
  dynamic_margin_sensitivity: 0.0
  dynamic_margin_window: 3
  trend_confirm_weeks: 0
factors:
  mom_window: 6
  vol_window: 10          # taper 开启时此硬窗口不生效(仅历史占位; 有效窗口见 vol_taper_window)
  pe_window_years: 5
  ewma_factors_enabled: false
  ewma_mom_halflife: 16
  ewma_vol_halflife: 6
  vol_taper_enabled: true
  vol_taper_window: 14
  vol_taper_len: 7
defense:
  def_alloc: 0.0
  step_low: 0.0764
  step_high: 0.384
  max_def: 0.0
  hongli_ratio: 0.5
crisis_correlation:
  window: 26
  corr_threshold: 1.01
  boost_slope: 1.875
  max_boost: 0.0
hongli_formula:
  intercept: 0.8
  vol_coeff: 2.67
rebalance:
  threshold: 0.025
  fee_rate: 5.0e-05
  anchor: W-MON
risk_control:
  stop_loss: 1.0
  recovery_weeks: 4
allocation:
  max_single_alloc: 1.0
  overflow_to_defense_only: true
  dynamic_weight_cap: false
inv_vol_allocation:
  enabled: false
  window: 14
d4_individual_filter:
  enabled: false
softmax_allocation:
  enabled: false
dynamic_weighting:
  enabled: false
constituent_signals:
  enabled: false
regime_classifier:
  enabled: false
data:
  nav_path: data/all_etfs_nav_latest.csv
  pe_path: data/300etf_pe_percentile_weekly.csv
  start_date: 2013-05-17
  end_date: null
reporting:
  risk_free_rate: 0.025
