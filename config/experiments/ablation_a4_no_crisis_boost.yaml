strategy:
  name: 消融A4 — 完整 v4.3 减 crisis boost（仅关 Layer3.5）
  version: '4.3-ablation-A4'
  note: "基于 v4.3 复制, 唯一改动: crisis_correlation.max_boost=0 且 corr_threshold=1.01(|corr|<=1 永不越过阈值, boost 恒为 0; 引擎 'if crisis_boost > 0' 分支永不进入)。其余与生产 v4.3 逐字段一致。v4.3 vs A4 之差 = Layer3.5 危机相关性加成的边际贡献。"
scoring:
  mom_w: 1.0
  vol_w: 1.1
selection:
  top_n: 2
  score_margin: 0.02
  dynamic_margin_sensitivity: 1.0
  dynamic_margin_window: 3
  trend_confirm_weeks: 0
factors:
  mom_window: 6
  vol_window: 10          # taper 开启时此硬窗口不生效(仅历史占位; 有效窗口见 vol_taper_window)
  pe_window_years: 5
  ewma_factors_enabled: false
  ewma_mom_halflife: 16
  ewma_vol_halflife: 6
  vol_taper_enabled: true
  vol_taper_window: 14
  vol_taper_len: 7
defense:
  def_alloc: 0.3492
  step_low: 0.0764
  step_high: 0.384
  max_def: 0.8299
  hongli_ratio: 0.5
crisis_correlation:
  window: 26
  corr_threshold: 1.01
  boost_slope: 1.875
  max_boost: 0.0
hongli_formula:
  intercept: 0.8
  vol_coeff: 2.67
rebalance:
  threshold: 0.025
  fee_rate: 5.0e-05
  anchor: W-MON
risk_control:
  stop_loss: 0.08
  recovery_weeks: 4
allocation:
  max_single_alloc: 0.4
  overflow_to_defense_only: true
  dynamic_weight_cap: false
inv_vol_allocation:
  enabled: true
  window: 14
d4_individual_filter:
  enabled: false
softmax_allocation:
  enabled: false
dynamic_weighting:
  enabled: false
constituent_signals:
  enabled: false
regime_classifier:
  enabled: false
data:
  nav_path: data/all_etfs_nav_latest.csv
  pe_path: data/300etf_pe_percentile_weekly.csv
  start_date: 2013-05-17
  end_date: null
reporting:
  risk_free_rate: 0.025
